<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 다이제스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --blue-500: oklch(0.620 0.191 258);
    --blue-50: oklch(0.959 0.020 250);
    --grey-900: oklch(0.237 0.020 258);
    --grey-700: oklch(0.460 0.028 256);
    --grey-600: oklch(0.562 0.025 254);
    --grey-500: oklch(0.666 0.021 253);
    --grey-200: oklch(0.930 0.005 248);
    --grey-100: oklch(0.966 0.003 248);
    --bg: var(--grey-100);           /* greyBackground */
    --surface: oklch(1 0 0);         /* layeredBackground */
    --hairline: oklch(0.930 0.005 248);
    --chip-active-bg: var(--grey-900);
    --chip-active-fg: oklch(1 0 0);
    --press: oklch(0 0 0 / 0.06);
    --shadow-1: 0 1px 2px oklch(0.155 0.060 261 / 0.04), 0 1px 1px oklch(0.155 0.060 261 / 0.04);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --blue-500: oklch(0.630 0.192 258);
      --blue-50: oklch(0.300 0.062 267);
      --grey-900: oklch(1 0 0);
      --grey-700: oklch(0.818 0.004 286);
      --grey-600: oklch(0.701 0.009 286);
      --grey-500: oklch(0.596 0.014 286);
      --grey-200: oklch(0.361 0.019 285);
      --grey-100: oklch(0.297 0.016 285);
      --bg: oklch(0.174 0.006 286);
      --surface: oklch(0.247 0.013 285);
      --hairline: oklch(0.361 0.019 285);
      --chip-active-bg: oklch(1 0 0);
      --chip-active-fg: oklch(0.207 0.010 286);
      --press: oklch(1 0 0 / 0.06);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --blue-500: oklch(0.630 0.192 258);
    --blue-50: oklch(0.300 0.062 267);
    --grey-900: oklch(1 0 0);
    --grey-700: oklch(0.818 0.004 286);
    --grey-600: oklch(0.701 0.009 286);
    --grey-500: oklch(0.596 0.014 286);
    --grey-200: oklch(0.361 0.019 285);
    --grey-100: oklch(0.297 0.016 285);
    --bg: oklch(0.174 0.006 286);
    --surface: oklch(0.247 0.013 285);
    --hairline: oklch(0.361 0.019 285);
    --chip-active-bg: oklch(1 0 0);
    --chip-active-fg: oklch(0.207 0.010 286);
    --press: oklch(1 0 0 / 0.06);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--grey-900);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  @media (min-width: 480px) { .wrap { padding: 40px 24px 80px; } }

  header { padding: 0 4px; margin-bottom: 20px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--grey-600); margin: 0 0 4px; }
  h1 { font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; margin: 0; }
  .sub { font-size: 15px; color: var(--grey-700); margin: 8px 0 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px; margin: 0 -4px 20px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips[hidden] { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--grey-200); background: var(--surface); color: var(--grey-700);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background 200ms var(--ease), color 200ms var(--ease);
  }
  .chip[aria-pressed="true"] { background: var(--chip-active-bg); color: var(--chip-active-fg); border-color: transparent; }
  .chip:focus-visible, .link:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  .card {
    background: var(--surface); border-radius: 24px; padding: 24px;
    margin-bottom: 12px; box-shadow: var(--shadow-1);
  }
  @media (max-width: 479px) { .card { padding: 20px; border-radius: 20px; } }

  .summary h2 { font-size: 20px; font-weight: 700; line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 16px; }
  .summary ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .summary li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; color: var(--grey-700); }
  .num {
    width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center;
    background: var(--blue-50); color: var(--blue-500);
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px;
  }

  .section-label { font-size: 13px; font-weight: 600; color: var(--grey-600); margin: 28px 4px 12px; }

  .article .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .badge {
    height: 22px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center;
    background: var(--grey-100); color: var(--grey-600);
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .article h3 { font-size: 18px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; margin: 0 0 8px; }
  .article p { margin: 0; color: var(--grey-700); line-height: 1.6; }
  .article .foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .link {
    display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: -10px -8px;
    padding: 0 8px; border-radius: 10px;
    color: var(--blue-500); font-size: 15px; font-weight: 600; text-decoration: none;
    transition: background 120ms var(--ease);
  }
  .link:hover { background: var(--press); }
  .link:active { background: var(--press); }
  .link svg { width: 16px; height: 16px; }

  .empty { text-align: center; padding: 40px 24px; }
  .empty .title { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  .empty p { margin: 0; color: var(--grey-600); }

  footer { text-align: center; font-size: 12px; color: var(--grey-500); margin-top: 32px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1>오늘의 다이제스트</h1>
    <p class="sub" id="sub"></p>
  </header>
  <nav class="chips" id="chips" aria-label="날짜 선택"></nav>
  <div id="content"></div>
  <footer>GeekNews RSS에서 AI 에이전트 · 업무 자동화 · 클로드 소식만 골랐어요</footer>
</main>

<script>
  const DATA = [{"date":"2026-11-11","highlights":["에이전트가 쓰는 글의 가독성과 데스크톱 앱 조작 능력을 높이는 도구가 나란히 소개됐다.","AI 회의록 요약이 내 제안을 합의 사항처럼 바꿔 적는 문제처럼, 업무 자동화 결과를 사람이 검증해야 하는 이유가 드러났다.","Anthropic의 Glasswing 취약점 발견 프로젝트는 보고 건수에 비해 실제 수정이 적어 오픈소스 유지보수자 부담이 논란이다."],"articles":[{"title":"Show GN: 에이전트가 글을 제대로 쓰도록 만들기, Human-readable writing","summary":"에이전트에 설치해 쓰는 글쓰기 스킬로, 뭉뚱그린 명사형 표현을 누가 무엇을 하는지 보이는 문장으로 바꾸고 단서나 예외는 관련 주장 바로 옆에 두게 한다. 사실과 수치, 용어는 그대로 두고 애매한 관계를 지어내지 않도록 하는 것이 핵심이며, 가독성 연구를 참고해 만들었다고 한다.","link":"https://news.hada.io/topic?id=36988"},{"title":"Vercel agent-desktop - AI 에이전트가 데스크톱 앱을 조작하는 CLI","summary":"맥·윈도우·리눅스에서 AI 에이전트가 앱 실행, 메뉴 클릭, 입력, 창 조절, 클립보드 사용까지 할 수 있게 해 주는 명령줄 도구다. 화면 좌표 대신 운영체제 접근성 API로 얻은 요소 ID를 써서 조작하므로, 마우스나 포커스를 빼앗지 않고도 안정적으로 동작하는 점이 특징이다.","link":"https://news.hada.io/topic?id=36967"},{"title":"Ask GN: 비개발자인데, AI 회의록 요약에서 제가 제안한 게 합의한 걸로 정리됩니다","summary":"영업 담당자가 고객 미팅 녹음을 AI로 요약해 쓰는데, 자신이 꺼낸 제안이 양측 합의처럼 기록되는 일이 생겨 결국 녹음 전체를 다시 확인하게 된다는 고민이다. 발언자별로 실제 발언과 제안을 나눠 달라고 지시해 조금 나아졌지만, 대화가 길게 뒤섞이면 여전히 구분이 흐려져 더 나은 방법을 묻고 있다.","link":"https://news.hada.io/topic?id=36986"},{"title":"7개월이 지난 Glasswing, 기대에 못 미치는 발견으로 유지보수자에게 과도한 부담을 주다","summary":"Anthropic이 Glasswing으로 찾아낸 취약점은 수만 건에 이르지만 공개된 것은 일부이고, 수정 완료로 확인된 것은 수백 건 수준에 그친다는 분석이다. 최근 몇 달간 발견 건수는 크게 늘었으나 수정은 거의 늘지 않았고 중복·철회가 더 많아, 오픈소스 유지보수자에게 검토 부담만 키운다는 비판이 나온다.","link":"https://news.hada.io/topic?id=36971"}]},{"date":"2026-11-12","highlights":["여러 에이전트가 동시에 코드를 다루면서 Anthropic·OpenAI가 버전 관리 인프라부터 다시 손보고 있다.","화면을 직접 읽고 조작하는 에이전트가 폰으로 넓어지는 한편, 항공사처럼 에이전트의 대리 행동을 막으려는 움직임도 나온다.","개발자들은 에이전트와 일하는 습관을 되돌아보고, Claude Code 사용량을 재미있게 보여 주는 도구도 만들고 있다."],"articles":[{"title":"AI 시대, git push 앞뒤에서 바뀌는 것들","summary":"Anthropic은 사내 모노레포의 Git을 자체 시스템 Scion으로 바꿨고, OpenAI는 Git 사용법은 그대로 두고 서버 쪽 백엔드 Pando를 새로 만들었다. 두 회사 모두 병렬 에이전트 작업으로 커진 저장소 부하가 계기였지만, 손댄 범위가 달랐다는 점을 비교한 글이다.","link":"https://news.hada.io/article/git-push-in-the-agent-era"},{"title":"Show GN: OpenPhoneUse – 화면을 보고 직접 탭하는 모바일용 Computer Use","summary":"안드로이드 폰 화면을 읽고 탭·입력·스크롤로 여러 앱을 넘나들며 일을 처리하는 AI 에이전트다. PC 연결이나 루트 없이 접근성 서비스만으로 폰 안에서 돌아가며, Claude를 포함한 여러 모델을 골라 쓸 수 있다.","link":"https://news.hada.io/topic?id=37020"},{"title":"United Airlines, AI 에이전트의 여행객 대리 항공편 예약 금지","summary":"United Airlines가 승인받지 않은 외부 AI 에이전트가 승객 대신 항공권을 예약하지 못하도록 정책을 고치고 있으며, 여행사나 검색 서비스를 거친 간접 접근도 막을 계획이다. 계정 정보를 에이전트에 넘기면 정보 유출, 원치 않는 결제나 마일 사용이 생길 수 있다는 것이 회사의 설명이다.","link":"https://news.hada.io/topic?id=37014"},{"title":"AI와 일할 때 가장 자주 던지는 질문: 지금 관성에 끌려가고 있는가?","summary":"AI 에이전트와 1년 넘게 개발한 필자는 환각보다 더 흔한 문제가, 단계마다 그럴듯해 보여서 처음 전제를 의심하지 않고 계속 밀고 나가는 \u0027관성\u0027이라고 말한다. 스킬 설계 기준을 다섯 달 동안 놓친 일 등 세 가지 경험을 들어 언제 멈추고 다시 봐야 하는지 짚는다.","link":"https://news.hada.io/topic?id=37030"},{"title":"Show GN: TokenPlant - Claude Code·Codex에 쓴 토큰으로 픽셀 식물을 키우는 macOS 메뉴바 앱","summary":"Claude Code와 Codex의 로컬 세션 로그를 주기적으로 읽어 토큰 사용량만큼 메뉴바의 픽셀 식물이 자라는 앱으로, 서버나 계정 없이 데이터가 밖으로 나가지 않는다. 성장 기준을 토큰 개수가 아닌 기간으로 잡아, 사용량이 많든 적든 비슷한 속도로 식물이 자라도록 만든 점이 특징이다.","link":"https://news.hada.io/topic?id=37012"}]}];

  const days = DATA.slice().sort((a, b) => b.date.localeCompare(a.date));
  const $ = (id) => document.getElementById(id);

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmtDate(iso, opts) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Intl.DateTimeFormat("ko-KR", opts).format(new Date(y, m - 1, d));
  }

  function safeUrl(u) {
    try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; }
    catch { return null; }
  }

  function render(date) {
    const day = days.find((d) => d.date === date) || days[0];
    const content = $("content");
    content.replaceChildren();

    if (!day) {
      $("eyebrow").textContent = "";
      $("sub").textContent = "아직 만든 다이제스트가 없어요";
      return;
    }

    $("eyebrow").textContent = fmtDate(day.date, { year: "numeric", month: "long", day: "numeric", weekday: "long" });
    $("sub").textContent = day.articles.length
      ? `관심 주제에 맞는 소식 ${day.articles.length}개를 골랐어요`
      : "오늘은 관심 주제에 맞는 소식이 없어요";

    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.date === day.date)));

    if (!day.articles.length) {
      const card = el("section", "card empty");
      card.append(el("p", "title", "해당 없음"), el("p", null, "내일 아침에 다시 살펴볼게요"));
      content.append(card);
      return;
    }

    if (day.highlights.length) {
      const card = el("section", "card summary");
      card.append(el("h2", null, "오늘의 세 줄 요약"));
      const ol = el("ol");
      day.highlights.forEach((h, i) => {
        const li = el("li");
        li.append(el("span", "num", String(i + 1)), el("span", null, h));
        ol.append(li);
      });
      card.append(ol);
      content.append(card);
    }

    content.append(el("p", "section-label", "기사별 요약"));

    day.articles.forEach((a, i) => {
      const card = el("article", "card article");
      const meta = el("div", "meta");
      meta.append(el("span", "badge", String(i + 1).padStart(2, "0")));
      card.append(meta, el("h3", null, a.title), el("p", null, a.summary));
      const href = safeUrl(a.link);
      if (href) {
        const foot = el("div", "foot");
        const link = el("a", "link");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.append("원문 보기");
        link.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>');
        foot.append(link);
        card.append(foot);
      }
      content.append(card);
    });
  }

  const chips = $("chips");
  days.forEach((d) => {
    const b = el("button", "chip", fmtDate(d.date, { month: "long", day: "numeric" }));
    b.type = "button";
    b.dataset.date = d.date;
    b.addEventListener("click", () => { history.replaceState(null, "", "#" + d.date); render(d.date); });
    chips.append(b);
  });
  if (days.length < 2) chips.hidden = true;

  render(location.hash.slice(1));
</script>
</body>
</html>
